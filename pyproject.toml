[build-system]
requires = ["setuptools==79.0.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pgvideo"
version = "0.1.0"
description = "On-demand PostgreSQL video requests"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
pgvideo = "pgvideo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
