# Pronunciations for Kokoro's American English voices (language code `a`).
#
# src/pgvideo/speech.py turns a script sentence's display text into the text
# Kokoro speaks. The screen and the captions keep the canonical spelling. The
# storyboard records this file's SHA-256, so narration is regenerated when it
# changes.
#
# terms:          whole words or identifiers, matched case-sensitively.
# parts:          pieces of snake_case and CamelCase identifiers, matched
#                 case-insensitively after the identifier is split.
# abbreviations:  prose abbreviations, matched exactly.
# units:          units after a number, such as `128MB` or `8 kB`. A term that
#                 starts at the unit wins: `133 B-tree indexes` has no unit.
#
# Unlisted identifier pieces are read as words. A piece without a vowel, or an
# all-capital piece of three letters or fewer, is spelled letter by letter.
schema: 1
language: a

terms:
  PostgreSQL: POST-gres-Q-L
  Postgres: POST-gres
  postgres: POST-gres
  psql: P-S-Q-L
  SQL: S-Q-L
  GUC: G U C
  # The plural needs its own form: Kokoro reads "G U Cs" as "G U C S".
  GUCs: G U C's
  WAL: wall
  MVCC: M V C C
  OID: O I D
  XID: X I D
  LSN: L S N
  TID: T I D
